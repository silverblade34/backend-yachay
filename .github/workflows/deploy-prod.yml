# .github/workflows/deploy-prod.yml
name: Deploy to Production

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # Navegar al directorio del proyecto
          cd /var/.yachay/backend-yachay
          
          # Detener los contenedores actuales
          podman-compose down || true
          
          # Hacer pull de los últimos cambios
          git fetch origin
          git reset --hard origin/prod
          
          # Crear el archivo .env con las variables de producción
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          S3_PUBLIC_URL=${{ secrets.S3_PUBLIC_URL }}
          S3_REGION=${{ secrets.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3=${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4=${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5=${{ secrets.GEMINI_API_KEY_5 }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF
          
          # Limpiar imágenes viejas para liberar espacio
          podman image prune -f
          
          # Construir y levantar los contenedores
          podman-compose up -d --build
          
          # Verificar que el contenedor esté corriendo
          podman ps
          
          # Opcional: Limpiar logs antiguos
          podman logs --tail=50 $(podman ps -q --filter "ancestor=*nestjs*")